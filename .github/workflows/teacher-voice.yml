name: Teacher voice
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tools/scan-voice-tests.mjs tools/teacher-voice-tests.mjs
      - run: node tools/scan-tests.mjs
